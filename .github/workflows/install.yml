on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - ".gitmodules"
      - "assets/**"
      - "requirements*.txt"
      - "third_party/MXU"
      - "**.py"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      signing_mode:
        description: "Build unsigned or submit MaaNTE.exe to the SignPath test policy"
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - test

env:
  MAA_FRAMEWORK_VERSION: "v5.10.5"

permissions:
  contents: write
  actions: write

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPOSITORY: ${{ github.repository }}
          SIGNING_MODE: ${{ inputs.signing_mode || 'unsigned' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          core='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          prerelease="${identifier}(\.${identifier})*"
          build='[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*'
          stable_regex="^v${core}\.${core}\.${core}(\+${build})?$"
          semver_regex="^v${core}\.${core}\.${core}(-${prerelease})?(\+${build})?$"

          is_stable_release=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ ! "$tag" =~ $semver_regex ]]; then
              echo "Invalid SemVer release tag: $tag"
              exit 1
            fi

            is_release=true
            echo "Release tag format is valid: $tag"
            if [[ "$tag" =~ $stable_regex ]]; then
              is_stable_release=true
            fi
          else
            is_release=false
            tag=$(curl --fail --silent --show-error \
              "https://api.github.com/repos/${REPOSITORY}/releases/latest" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              | jq -r '.tag_name // empty' || true)
            if [[ ! "$tag" =~ $stable_regex ]]; then
              echo "No valid release tag found, using v0.0.1"
              tag="v0.0.1"
            fi
            tag="${tag}-ci.$(date +%y%m%d)-$(git rev-parse --short HEAD)"
          fi

          is_prerelease=true
          if [ "$is_stable_release" = "true" ]; then
            is_prerelease=false
          fi

          trusted_release=false
          if [ "$is_release" = "true" ] \
            && [ "$EVENT_NAME" = "push" ] \
            && [ "$REF_TYPE" = "tag" ] \
            && [ "$REPOSITORY" = "1bananachicken/MaaNTE" ]; then
            git fetch --no-tags origin "+refs/heads/dev:refs/remotes/origin/dev"
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
              trusted_release=true
            else
              echo "Release tag commit $GITHUB_SHA is not contained in origin/dev; release signing is disabled."
            fi
          fi

          build_required=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
              echo "Pull request base/head SHA is unavailable; refusing to skip the build."
              exit 1
            fi

            build_required=false
            changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/install.yml|.gitmodules|assets/*|requirements*.txt|third_party/MXU|*.py)
                  build_required=true
                  break
                  ;;
              esac
            done <<< "$changed_files"
          fi

          test_signing=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] \
            && [ "$SIGNING_MODE" = "test" ] \
            && [ "$REF_TYPE" = "branch" ] \
            && [ "$REPOSITORY" = "1bananachicken/MaaNTE" ]; then
            test_signing=true
          fi

          signing_requested=false
          if [ "$trusted_release" = "true" ] || [ "$test_signing" = "true" ]; then
            signing_requested=true
          fi

          if [ "$test_signing" = "true" ]; then
            final_artifact_name="test-signed-MaaNTE-win-x86_64-${tag}-MXU"
          else
            final_artifact_name="MaaNTE-win-x86_64-${tag}-MXU"
          fi

          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"
          echo "is_release=$is_release" | tee -a "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" | tee -a "$GITHUB_OUTPUT"
          echo "trusted_release=$trusted_release" | tee -a "$GITHUB_OUTPUT"
          echo "test_signing=$test_signing" | tee -a "$GITHUB_OUTPUT"
          echo "signing_requested=$signing_requested" | tee -a "$GITHUB_OUTPUT"
          echo "build_required=$build_required" | tee -a "$GITHUB_OUTPUT"
          echo "final_artifact_name=$final_artifact_name" | tee -a "$GITHUB_OUTPUT"

    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}
      trusted_release: ${{ steps.set_tag.outputs.trusted_release }}
      test_signing: ${{ steps.set_tag.outputs.test_signing }}
      signing_requested: ${{ steps.set_tag.outputs.signing_requested }}
      build_required: ${{ steps.set_tag.outputs.build_required }}
      final_artifact_name: ${{ steps.set_tag.outputs.final_artifact_name }}

  build_mxu_raw:
    needs: meta
    if: ${{ needs.meta.outputs.build_required == 'true' }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    outputs:
      signpath_artifact_id: ${{ steps.upload-signing-input.outputs.artifact-id }}
      raw_artifact_id: ${{ steps.upload-raw-handoff.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify MXU fork checkout
        shell: bash
        run: |
          set -euo pipefail

          expected_url="https://github.com/1bananachicken/MXU.git"
          actual_url="$(git -C third_party/MXU remote get-url origin)"
          expected_commit="$(git ls-tree HEAD third_party/MXU | awk '{print $3}')"
          actual_commit="$(git -C third_party/MXU rev-parse HEAD)"

          test "$actual_url" = "$expected_url"
          test "$actual_commit" = "$expected_commit"
          test -z "$(git -C third_party/MXU status --porcelain)"
          echo "MXU source: $actual_url@$actual_commit"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: third_party/MXU/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build MXU from source
        working-directory: third_party/MXU
        run: >-
          pnpm install --frozen-lockfile &&
          pnpm tauri build --ci --no-bundle
          --target x86_64-pc-windows-msvc
          -- --locked

      - name: Check source-built executable
        shell: bash
        run: |
          test -f third_party/MXU/src-tauri/target/x86_64-pc-windows-msvc/release/MaaNTE.exe
          sha256sum third_party/MXU/src-tauri/target/x86_64-pc-windows-msvc/release/MaaNTE.exe

      - name: Upload raw executable for SignPath
        if: ${{ needs.meta.outputs.signing_requested == 'true' }}
        id: upload-signing-input
        uses: actions/upload-artifact@v7
        with:
          name: signpath-input-MaaNTE-${{ github.run_id }}-${{ github.run_attempt }}
          path: third_party/MXU/src-tauri/target/x86_64-pc-windows-msvc/release/MaaNTE.exe
          archive: false
          retention-days: 1

      - name: Upload raw executable handoff
        if: ${{ needs.meta.outputs.signing_requested != 'true' }}
        id: upload-raw-handoff
        uses: actions/upload-artifact@v4
        with:
          name: raw-MaaNTE-${{ github.run_id }}-${{ github.run_attempt }}
          path: third_party/MXU/src-tauri/target/x86_64-pc-windows-msvc/release/MaaNTE.exe
          retention-days: 1

  test_sign:
    if: ${{ needs.meta.outputs.test_signing == 'true' }}
    needs: [meta, build_mxu_raw]
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    environment: test-signing
    outputs:
      signed_artifact_id: ${{ steps.upload-signed.outputs.artifact-id }}
    steps:
      - name: Submit test signing request
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 52da06e6-4590-473f-a3c3-ae7ea178db3e
          project-slug: MaaNTE
          signing-policy-slug: test-signing
          github-artifact-id: ${{ needs.build_mxu_raw.outputs.signpath_artifact_id }}
          wait-for-completion: true
          output-artifact-directory: signed-artifact
          skip-decompress: true
          parameters: |
            version: ${{ toJSON(needs.meta.outputs.tag) }}

      - name: Check signed executable
        shell: bash
        run: test -f signed-artifact/MaaNTE.exe

      - name: Upload signed executable
        id: upload-signed
        uses: actions/upload-artifact@v4
        with:
          name: test-signed-executable-MaaNTE-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed-artifact/MaaNTE.exe
          retention-days: 1

  release_sign:
    if: ${{ needs.meta.outputs.trusted_release == 'true' }}
    needs: [meta, build_mxu_raw]
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    environment: production-signing
    outputs:
      signed_artifact_id: ${{ steps.upload-signed.outputs.artifact-id }}
    steps:
      - name: Submit release signing request
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 52da06e6-4590-473f-a3c3-ae7ea178db3e
          project-slug: MaaNTE
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build_mxu_raw.outputs.signpath_artifact_id }}
          wait-for-completion: true
          output-artifact-directory: signed-artifact
          skip-decompress: true
          parameters: |
            version: ${{ toJSON(needs.meta.outputs.tag) }}

      - name: Check signed executable
        shell: bash
        run: test -f signed-artifact/MaaNTE.exe

      - name: Upload signed executable
        id: upload-signed
        uses: actions/upload-artifact@v4
        with:
          name: release-signed-executable-MaaNTE-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed-artifact/MaaNTE.exe
          retention-days: 1

  package_windows:
    name: Package Windows artifact
    if: >-
      ${{
        always() && !cancelled() &&
        needs.meta.result == 'success' &&
        needs.meta.outputs.build_required == 'true' &&
        needs.build_mxu_raw.result == 'success' &&
        (
          (needs.meta.outputs.trusted_release == 'true' && needs.release_sign.result == 'success') ||
          (needs.meta.outputs.test_signing == 'true' && needs.test_sign.result == 'success') ||
          (needs.meta.outputs.signing_requested != 'true' &&
           needs.release_sign.result == 'skipped' && needs.test_sign.result == 'skipped')
        )
      }}
    needs: [meta, build_mxu_raw, test_sign, release_sign]
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    outputs:
      final_artifact_id: ${{ steps.upload-final.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Download test-signed executable
        if: ${{ needs.meta.outputs.test_signing == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.test_sign.outputs.signed_artifact_id }}
          path: selected-executable
          merge-multiple: true

      - name: Download release-signed executable
        if: ${{ needs.meta.outputs.trusted_release == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release_sign.outputs.signed_artifact_id }}
          path: selected-executable
          merge-multiple: true

      - name: Download unsigned executable
        if: ${{ needs.meta.outputs.signing_requested != 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build_mxu_raw.outputs.raw_artifact_id }}
          path: selected-executable
          merge-multiple: true

      - name: Set platform variables
        id: platform
        shell: bash
        run: echo "tag=x64" >> "$GITHUB_OUTPUT"

      - name: Download PacketNTE thirdparty
        id: download_packetnte
        uses: robinraju/release-downloader@v1
        with:
          repository: 1pineappleduck/PacketNTE
          fileName: "nte_coordinate_api-*.zip"
          latest: true
          out-file-path: "PacketNTE"
          extract: false

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-win-x86_64*"
          tag: ${{ env.MAA_FRAMEWORK_VERSION }}
          out-file-path: "deps"
          extract: true

      - name: Setup Embed Python on Windows
        shell: bash
        run: python tools/ci/setup_embed_python.py

      - name: Download Python dependencies
        shell: bash
        run: ./install/python/python.exe tools/ci/download_deps.py --deps-dir install/deps

      - name: Create MXU version
        shell: bash
        run: |
          ./install/python/python.exe ./tools/ci/install_mxu.py ${{ needs.meta.outputs.tag }}
          cp -rpvn install/python/. install-mxu/python/
          if [ -d "install/deps" ]; then
            cp -rpvn install/deps/. install-mxu/deps/
          fi

      - name: Copy PacketNTE thirdparty to MXU version
        shell: bash
        run: |
          archive_path="${{ fromJson(steps.download_packetnte.outputs.downloaded_files)[0] }}"
          extract_dir="PacketNTE-extracted"
          mkdir -p "$extract_dir"

          python - "$archive_path" "$extract_dir" << 'PYEOF'
          import sys
          import zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          extract_dir = Path(sys.argv[2]).resolve()

          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  target = (extract_dir / name).resolve()
                  if extract_dir != target and extract_dir not in target.parents:
                      raise RuntimeError(f"Unsafe PacketNTE archive entry: {info.filename}")
                  if name.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(info) as src, target.open("wb") as dst:
                      dst.write(src.read())
          PYEOF

          if [ ! -d "$extract_dir/thirdparty" ]; then
            echo "PacketNTE release did not extract to $extract_dir/thirdparty."
            exit 1
          fi

          rm -rf install-mxu/thirdparty
          cp -a "$extract_dir/thirdparty" install-mxu/thirdparty

      - name: Pre-install all dependencies
        shell: bash
        run: |
          ./install-mxu/python/python.exe -m pip install \
            --no-index \
            --find-links install-mxu/deps \
            -r requirements.txt

      - name: Install and patch soundcard
        shell: bash
        run: |
          ./install-mxu/python/python.exe -m pip install \
            --no-index \
            --find-links install-mxu/deps \
            soundcard

          ./install-mxu/python/python.exe - << 'PYEOF'
          import sys, soundcard
          from pathlib import Path

          path = Path(soundcard.__path__[0]) / "mediafoundation.py"
          content = path.read_text()
          if "_ffi.dlopen('ole32')" not in content:
              print(f"Expected soundcard patch target not found in {path}.")
              sys.exit(1)
          path.write_text(content.replace("_ffi.dlopen('ole32')", "_ffi.dlopen('ole32.dll')"))
          PYEOF

          rm -f install-mxu/deps/soundcard-*.whl

      - name: Remove deps directory to reduce package size
        shell: bash
        run: rm -rf install-mxu/deps

      - name: Copy selected MXU executable and icon
        shell: bash
        run: |
          set -euo pipefail

          exe="selected-executable/MaaNTE.exe"
          test -f "$exe"
          test -f third_party/MXU/src-tauri/icons/icon.ico

          cp "$exe" install-mxu/MaaNTE.exe
          cp third_party/MXU/src-tauri/icons/icon.ico install-mxu/logo.ico
          sha256sum install-mxu/MaaNTE.exe

      - name: Upload final package
        id: upload-final
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.final_artifact_name }}
          path: install-mxu
          overwrite: true

  windows:
    name: windows (x86_64, windows-latest)
    if: ${{ always() }}
    needs: [meta, build_mxu_raw, test_sign, release_sign, package_windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Windows workflow result
        shell: bash
        env:
          META_RESULT: ${{ needs.meta.result }}
          BUILD_REQUIRED: ${{ needs.meta.outputs.build_required }}
          BUILD_RESULT: ${{ needs.build_mxu_raw.result }}
          PACKAGE_RESULT: ${{ needs.package_windows.result }}
        run: |
          set -euo pipefail

          if [ "$META_RESULT" != "success" ]; then
            echo "The metadata job did not succeed: $META_RESULT"
            exit 1
          fi

          if [ "$BUILD_REQUIRED" != "true" ]; then
            if [ "$BUILD_RESULT" != "skipped" ] || [ "$PACKAGE_RESULT" != "skipped" ]; then
              echo "Unexpected result for an unrelated pull request: build=$BUILD_RESULT package=$PACKAGE_RESULT"
              exit 1
            fi
            echo "No release artifact inputs changed; the Windows build was skipped."
            exit 0
          fi

          if [ "$BUILD_RESULT" != "success" ]; then
            echo "The MXU source build did not succeed: $BUILD_RESULT"
            exit 1
          fi

          if [ "$PACKAGE_RESULT" != "success" ]; then
            echo "The signing and final package chain did not succeed: $PACKAGE_RESULT"
            exit 1
          fi

          echo "Windows build gate passed."

  release:
    if: >-
      ${{
        needs.meta.outputs.trusted_release == 'true' &&
        needs.package_windows.result == 'success' &&
        needs.windows.result == 'success'
      }}
    needs: [meta, package_windows, windows]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: >-
            -vv --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Check release notes
        shell: bash
        run: test -s CHANGES.md

      - name: Download final artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.package_windows.outputs.final_artifact_id }}
          path: downloaded-artifact
          merge-multiple: true

      - name: Package release asset
        shell: bash
        run: |
          mkdir -p release-assets
          (cd downloaded-artifact && zip -r "../release-assets/${{ needs.meta.outputs.final_artifact_name }}.zip" .)

      - uses: softprops/action-gh-release@v2.2.2
        with:
          files: release-assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          body_path: CHANGES.md
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

      - name: Trigger MirrorChyanUploading
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ needs.meta.outputs.tag }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ needs.meta.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
