on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - ".gitmodules"
      - "assets/**"
      - "requirements*.txt"
      - "third_party/MXU"
      - "tools/ci/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - ".gitmodules"
      - "assets/**"
      - "requirements*.txt"
      - "third_party/MXU"
      - "tools/ci/**"
      - "**.py"
  workflow_dispatch:
    inputs:
      signing_mode:
        description: "Select test to submit the build to SignPath test-signing without creating a release"
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - test

env:
  MAA_FRAMEWORK_VERSION: "v5.10.5"
  MAA_FRAMEWORK_X86_64_SHA256: "e1f4cf62099fade89b39c4c0cd45c6673530fcacc8a343912036f2fab5d18615"
  PACKET_NTE_VERSION: "v1.2.0"
  PACKET_NTE_SHA256: "93d856edb3813c5087a38b730d62969b24da4b537142786c8d34381760263d63"

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: set_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPOSITORY: ${{ github.repository }}
          SIGNING_MODE: ${{ inputs.signing_mode || 'unsigned' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          core='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          prerelease="${identifier}(\.${identifier})*"
          build='[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*'
          stable_regex="^v${core}\.${core}\.${core}(\+${build})?$"
          semver_regex="^v${core}\.${core}\.${core}(-${prerelease})?(\+${build})?$"

          is_stable_release=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ ! "$tag" =~ $semver_regex ]]; then
              echo "Invalid SemVer release tag: $tag"
              exit 1
            fi

            is_release=true
            echo "Release tag format is valid: $tag"
            if [[ "$tag" =~ $stable_regex ]]; then
              is_stable_release=true
            fi
          else
            is_release=false
            tag=$(curl --fail --silent --show-error \
              "https://api.github.com/repos/${REPOSITORY}/releases/latest" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              | awk '/tag_name/{print $4}' FS='["]' || true)
            if [[ ! "$tag" =~ $stable_regex ]]; then
              echo "No valid release tag found, using v0.0.1"
              tag="v0.0.1"
            fi
            tag="${tag}-ci.$(date +%y%m%d)-$(git rev-parse --short HEAD)"
          fi

          is_prerelease=true
          if [ "$is_stable_release" = "true" ]; then
            is_prerelease=false
          fi

          trusted_release=false
          if [ "$is_release" = "true" ] \
            && [ "$EVENT_NAME" = "push" ] \
            && [ "$REF_TYPE" = "tag" ] \
            && [ "$REPOSITORY" = "1bananachicken/MaaNTE" ]; then
            git fetch --no-tags origin "+refs/heads/dev:refs/remotes/origin/dev"
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
              trusted_release=true
            else
              echo "Release tag commit $GITHUB_SHA is not contained in origin/dev; signing is disabled."
            fi
          fi

          test_signing=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] \
            && [ "$SIGNING_MODE" = "test" ] \
            && [ "$REF_TYPE" = "branch" ] \
            && [ "$REPOSITORY" = "1bananachicken/MaaNTE" ]; then
            test_signing=true
          fi

          signing_requested=false
          if [ "$trusted_release" = "true" ] || [ "$test_signing" = "true" ]; then
            signing_requested=true
          fi

          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"
          echo "is_release=$is_release" | tee -a "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" | tee -a "$GITHUB_OUTPUT"
          echo "trusted_release=$trusted_release" | tee -a "$GITHUB_OUTPUT"
          echo "test_signing=$test_signing" | tee -a "$GITHUB_OUTPUT"
          echo "signing_requested=$signing_requested" | tee -a "$GITHUB_OUTPUT"
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}
      trusted_release: ${{ steps.set_tag.outputs.trusted_release }}
      test_signing: ${{ steps.set_tag.outputs.test_signing }}
      signing_requested: ${{ steps.set_tag.outputs.signing_requested }}

  windows:
    needs: meta
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    outputs:
      unsigned_executable_artifact_id: ${{ steps.upload-unsigned-executable.outputs.artifact-id }}
      unsigned_package_artifact_id: ${{ steps.upload-unsigned-package.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set platform variables
        id: platform
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            echo "tag=x64" >> $GITHUB_OUTPUT
          else
            echo "tag=arm64" >> $GITHUB_OUTPUT
          fi

      - name: Download PacketNTE thirdparty
        id: download_packetnte
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1
        with:
          repository: 1pineappleduck/PacketNTE
          fileName: "nte_coordinate_api-${{ env.PACKET_NTE_VERSION }}.cp312-win_amd64.zip"
          tag: ${{ env.PACKET_NTE_VERSION }}
          out-file-path: "PacketNTE"
          extract: false

      - name: Download MaaFramework
        id: download_maaframework
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-win-${{ matrix.arch }}-${{ env.MAA_FRAMEWORK_VERSION }}.zip"
          tag: ${{ env.MAA_FRAMEWORK_VERSION }}
          out-file-path: "deps"
          extract: false

      - name: Verify pinned release assets
        shell: bash
        run: |
          set -euo pipefail

          packet_archive="${{ fromJson(steps.download_packetnte.outputs.downloaded_files)[0] }}"
          maafw_archive="${{ fromJson(steps.download_maaframework.outputs.downloaded_files)[0] }}"

          echo "${PACKET_NTE_SHA256}  ${packet_archive}" | sha256sum --check --strict
          echo "${MAA_FRAMEWORK_X86_64_SHA256}  ${maafw_archive}" | sha256sum --check --strict

      - name: Extract MaaFramework
        shell: bash
        run: |
          python - "${{ fromJson(steps.download_maaframework.outputs.downloaded_files)[0] }}" deps << 'PYEOF'
          import sys
          import zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          extract_dir = Path(sys.argv[2]).resolve()

          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  target = (extract_dir / name).resolve()
                  if extract_dir != target and extract_dir not in target.parents:
                      raise RuntimeError(f"Unsafe MaaFramework archive entry: {info.filename}")
                  if name.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(info) as src, target.open("wb") as dst:
                      dst.write(src.read())
          PYEOF

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: "10.28.0"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: third_party/MXU/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.arch == 'x86_64' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}

      - name: Cache MXU Rust build
        if: ${{ needs.meta.outputs.signing_requested != 'true' }}
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: "third_party/MXU/src-tauri -> target"
          shared-key: "mxu-windows-${{ matrix.arch }}"
          cache-on-failure: true

      - name: Verify MXU source checkout
        shell: bash
        run: |
          expected_url="https://github.com/1bananachicken/MXU.git"
          actual_url="$(git -C third_party/MXU remote get-url origin)"
          expected_commit="$(git ls-tree HEAD third_party/MXU | awk '{print $3}')"
          actual_commit="$(git -C third_party/MXU rev-parse HEAD)"

          if [ "$actual_url" != "$expected_url" ]; then
            echo "Unexpected MXU source URL: $actual_url"
            exit 1
          fi
          if [ "$actual_commit" != "$expected_commit" ]; then
            echo "MXU checkout $actual_commit does not match gitlink $expected_commit"
            exit 1
          fi
          if [ -n "$(git -C third_party/MXU status --porcelain)" ]; then
            echo "MXU source checkout is dirty before build"
            git -C third_party/MXU status --short
            exit 1
          fi

          echo "MXU source: $actual_url@$actual_commit"

      - name: Install MXU frontend dependencies
        working-directory: third_party/MXU
        run: pnpm install --frozen-lockfile

      - name: Build MXU from source
        working-directory: third_party/MXU
        run: >-
          pnpm tauri build --ci --no-bundle
          --target ${{ matrix.arch == 'x86_64' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}
          -- --locked

      - name: Upload source-built executable for signing
        if: ${{ needs.meta.outputs.signing_requested == 'true' }}
        id: upload-unsigned-executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: third_party/MXU/src-tauri/target/${{ matrix.arch == 'x86_64' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}/release/MaaNTE.exe
          archive: false
          retention-days: 1

      - name: Setup Embed Python on Windows
        shell: bash
        run: |
          python tools/ci/setup_embed_python.py

      - name: Download Python dependencies
        shell: bash
        run: |
          ./install/python/python.exe tools/ci/download_deps.py --deps-dir install/deps

      - name: Create MXU version
        shell: bash
        run: |
          ./install/python/python.exe ./tools/ci/install_mxu.py ${{ needs.meta.outputs.tag }}
          cp -rpvn install/python/. install-mxu/python/
          if [ -d "install/deps" ]; then
            cp -rpvn install/deps/. install-mxu/deps/
          fi

      - name: Copy PacketNTE thirdparty to MXU version
        shell: bash
        run: |
          archive_path="${{ fromJson(steps.download_packetnte.outputs.downloaded_files)[0] }}"
          extract_dir="PacketNTE-extracted"
          mkdir -p "$extract_dir"

          python - "$archive_path" "$extract_dir" << 'PYEOF'
          import sys
          import zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          extract_dir = Path(sys.argv[2]).resolve()

          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  target = (extract_dir / name).resolve()
                  if extract_dir != target and extract_dir not in target.parents:
                      raise RuntimeError(f"Unsafe PacketNTE archive entry: {info.filename}")
                  if name.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(info) as src, target.open("wb") as dst:
                      dst.write(src.read())
          PYEOF

          if [ ! -d "$extract_dir/thirdparty" ]; then
            echo "PacketNTE release did not extract to $extract_dir/thirdparty."
            find "$extract_dir" -maxdepth 2 -type d -print
            exit 1
          fi

          rm -rf install-mxu/thirdparty
          cp -a "$extract_dir/thirdparty" install-mxu/thirdparty
          echo "Added PacketNTE thirdparty to install-mxu/thirdparty"

      - name: Pre-install all dependencies
        shell: bash
        run: |
          echo "Pre-installing all dependencies into embedded Python..."
          ./install-mxu/python/python.exe -m pip install \
            --no-index \
            --find-links install-mxu/deps \
            -r requirements.txt

      - name: Install and patch soundcard
        shell: bash
        run: |
          echo "Installing soundcard into embedded Python..."
          ./install-mxu/python/python.exe -m pip install \
            --no-index \
            --find-links install-mxu/deps \
            soundcard

          echo "Patching soundcard ole32 → ole32.dll..."
          ./install-mxu/python/python.exe - << 'PYEOF'
          import sys, soundcard
          from pathlib import Path
          p = Path(soundcard.__path__[0]) / 'mediafoundation.py'
          c = p.read_text()
          if "_ffi.dlopen('ole32')" not in c:
              print(f'ERROR: expected ole32 patch target not found in {p}. soundcard may have changed.')
              sys.exit(1)
          c = c.replace("_ffi.dlopen('ole32')", "_ffi.dlopen('ole32.dll')")
          p.write_text(c)
          print('Patched:', p)
          PYEOF

          echo "Removing soundcard wheel from deps to prevent re-install..."
          rm -f install-mxu/deps/soundcard-*.whl

      - name: Copy source-built MXU to MXU version
        shell: bash
        run: |
          target="${{ matrix.arch == 'x86_64' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}"
          mxu_exe="third_party/MXU/src-tauri/target/$target/release/MaaNTE.exe"
          mxu_icon="third_party/MXU/src-tauri/icons/icon.ico"

          test -f "$mxu_exe"
          test -f "$mxu_icon"
          mkdir -p install-mxu
          cp "$mxu_exe" install-mxu/MaaNTE.exe
          cp "$mxu_icon" install-mxu/logo.ico

          echo "Unsigned MaaNTE executable built from MXU source:"
          sha256sum install-mxu/MaaNTE.exe

      - name: Remove deps directory to reduce package size
        shell: bash
        run: |
          echo "Removing deps directory to reduce package size..."
          rm -rf install-mxu/deps
          echo "Deps directory removed. Package size reduced by ~171MB."

      - name: Upload unsigned package for signing
        if: ${{ needs.meta.outputs.signing_requested == 'true' }}
        id: upload-unsigned-package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-MaaNTE-win-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}-MXU
          path: install-mxu
          retention-days: 1

      - name: Upload unsigned build artifact
        if: ${{ needs.meta.outputs.signing_requested != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MaaNTE-win-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}-MXU
          path: install-mxu

  test-sign:
    if: ${{ needs.meta.outputs.test_signing == 'true' }}
    needs: [meta, windows]
    runs-on: windows-latest
    permissions:
      actions: write
      contents: read
    environment: test-signing
    steps:
      - name: Download unsigned package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-MaaNTE-win-x86_64-${{ needs.meta.outputs.tag }}-MXU
          path: install-mxu

      - name: Submit test signing request
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 52da06e6-4590-473f-a3c3-ae7ea178db3e
          project-slug: MaaNTE
          signing-policy-slug: test-signing
          github-artifact-id: ${{ needs.windows.outputs.unsigned_executable_artifact_id }}
          wait-for-completion: true
          output-artifact-directory: signed-artifact
          skip-decompress: true
          parameters: |
            version: ${{ toJSON(needs.meta.outputs.tag) }}

      - name: Replace unsigned executable with test-signed executable
        shell: bash
        run: cp signed-artifact/MaaNTE.exe install-mxu/MaaNTE.exe

      - name: Upload test-signed build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-signed-MaaNTE-win-x86_64-${{ needs.meta.outputs.tag }}-MXU
          path: install-mxu
          retention-days: 7

      - name: Delete signing-only artifacts
        if: ${{ success() }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const artifactIds = [
              Number('${{ needs.windows.outputs.unsigned_executable_artifact_id }}'),
              Number('${{ needs.windows.outputs.unsigned_package_artifact_id }}')
            ].filter((id) => Number.isInteger(id) && id > 0);

            for (const artifactId of artifactIds) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifactId
              });
            }

  sign:
    if: ${{ needs.meta.outputs.trusted_release == 'true' }}
    needs: [meta, windows]
    runs-on: windows-latest
    permissions:
      actions: write
      contents: read
    environment: production-signing
    steps:
      - name: Download unsigned package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-MaaNTE-win-x86_64-${{ needs.meta.outputs.tag }}-MXU
          path: install-mxu

      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 52da06e6-4590-473f-a3c3-ae7ea178db3e
          project-slug: MaaNTE
          signing-policy-slug: test-signing
          github-artifact-id: ${{ needs.windows.outputs.unsigned_executable_artifact_id }}
          wait-for-completion: true
          output-artifact-directory: signed-artifact
          skip-decompress: true
          parameters: |
            version: ${{ toJSON(needs.meta.outputs.tag) }}

      - name: Replace unsigned executable with signed executable
        shell: bash
        run: cp signed-artifact/MaaNTE.exe install-mxu/MaaNTE.exe

      - name: Upload signed build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MaaNTE-win-x86_64-${{ needs.meta.outputs.tag }}-MXU
          path: install-mxu

      - name: Delete signing-only artifacts
        if: ${{ success() }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const artifactIds = [
              Number('${{ needs.windows.outputs.unsigned_executable_artifact_id }}'),
              Number('${{ needs.windows.outputs.unsigned_package_artifact_id }}')
            ].filter((id) => Number.isInteger(id) && id > 0);

            for (const artifactId of artifactIds) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifactId
              });
            }

  release:
    if: ${{ needs.meta.outputs.trusted_release == 'true' }}
    needs: [meta, windows, sign]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: .github/cliff.toml
          # 正式版：使用 tag-pattern 只匹配正式版标签，包含所有从上一个正式版以来的提交
          # 预发布版：正常生成，只包含从上一个标签以来的提交
          args: >-
            -vv --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Check release notes
        shell: bash
        run: |
          test -s CHANGES.md
          cat CHANGES.md

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: downloaded-artifacts
          pattern: MaaNTE-*-MXU

      - name: Process and package artifacts
        shell: bash
        run: |
          artifact_dir="$PWD/downloaded-artifacts"
          release_dir="$PWD/release-assets"
          mkdir -p "$release_dir"

          for f in "$artifact_dir"/*; do
            artifact_name="$(basename "$f")"

            if [[ ! -d "$f" ]]; then
              echo "Skipping non-directory artifact entry: $artifact_name"
              continue
            fi

            if [[ $artifact_name == *"win"* ]]; then
              echo "Processing Windows artifact: $artifact_name"
              (cd "$f" && zip -r "$release_dir/$artifact_name.zip" .)
            else
              echo "Processing Unix artifact: $artifact_name"

              if [[ -f "$f/MaaPiCli" ]]; then
                chmod +x "$f/MaaPiCli"
                echo "Set execute permission for $artifact_name/MaaPiCli"
              fi

              find "$f" -type f -name "MFAUpdater*" -exec chmod +x {} \; 2>/dev/null || true
              echo "Set execute permission for all MFAUpdater files"

              if [[ -f "$f/MaaNTE" ]]; then
                chmod +x "$f/MaaNTE"
                echo "Set execute permission for $artifact_name/MaaNTE"
              fi

              for PYTHON_PATH in "$f/python/bin/python3" "$f/python/python" "$f/python/bin/python" "$f/python/python.exe"; do
                if [[ -f "$PYTHON_PATH" ]]; then
                  chmod +x "$PYTHON_PATH"
                  echo "Set execute permission for ${PYTHON_PATH#$artifact_dir/}"
                fi
              done

              tar -cpzf "$release_dir/$artifact_name.tar.gz" -C "$f" .
              echo "Created archive with preserved permissions: $artifact_name.tar.gz"
            fi
          done

          if [[ -z "$(find "$release_dir" -maxdepth 1 -type f -print -quit)" ]]; then
            echo "No release assets were created."
            exit 1
          fi

      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: release-assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          body_path: CHANGES.md
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

      - name: Trigger MirrorChyanUploading
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ needs.meta.outputs.tag }}
