version: 2

updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
      time: "02:47"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "third_party/MXU"
    labels:
      - "dependencies"
      - "mxu"
    assignees:
      - "1bananachicken"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:17"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    assignees:
      - "1bananachicken"
    commit-message:
      prefix: "chore"
      include: "scope"
